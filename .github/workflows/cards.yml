name: Generate README Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch stat cards (runner 侧抓取，规避国内访问 vercel 不稳)
        run: |
          mkdir -p dist
          curl -fsSL --retry 3 --retry-delay 3 -o dist/stats.svg "https://github-readme-stats.vercel.app/api?username=Solomonstery&show_icons=true&theme=tokyonight&bg_color=0d1117&hide_border=true&count_private=true&include_all_commits=true&locale=zh-cn"
          curl -fsSL --retry 3 --retry-delay 3 -o dist/langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=Solomonstery&layout=compact&theme=tokyonight&bg_color=0d1117&hide_border=true&langs_count=8&locale=zh-cn"
          curl -fsSL --retry 3 --retry-delay 3 -o dist/streak.svg "https://streak-stats.demolab.com/?user=Solomonstery&theme=tokyonight&background=0D1117&hide_border=true&border_radius=8&locale=zh_Hans"
          curl -fsSL --retry 3 --retry-delay 3 -o dist/activity.svg "https://github-readme-activity-graph.vercel.app/graph?username=Solomonstery&bg_color=0d1117&color=58a6ff&line=58a6ff&point=ffffff&area=true&hide_border=true&theme=github-compact&custom_title=%E8%B4%A1%E7%8C%AE%E6%B4%BB%E5%8A%A8%E8%B6%8B%E5%8A%BF"
          ls -la dist

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push cards to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
